<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護家名單及病歷號比對系統</title>
    <!-- 引入 SheetJS 讀取 Excel 檔 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f7fa;
        }
        h2 {
            color: #333;
        }
        .section {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status {
            font-weight: bold;
            color: #555;
            margin-top: 10px;
        }
        .divider {
            margin: 15px 0;
            text-align: center;
            color: #888;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background-color: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
    </style>
</head>
<body>

    <h2>護家名單及病歷號比對工具</h2>

    <!-- 1. 載入或輸入名單區塊 -->
    <div class="section">
        <h3>1. 匯入或輸入名單資料庫</h3>
        
        <!-- 方式 A：檔案上傳 -->
        <label><strong>方式 A：選擇 Excel 檔案</strong></label><br>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="margin-top: 5px;">
        
        <div class="divider">或</div>
        
        <!-- 方式 B：文字框直接貼上報表文字 -->
        <label><strong>方式 B：直接貼上包含病歷號與姓名的報表文字</strong></label>
        <textarea id="manualDataInput" style="height: 120px; margin-top: 5px;" placeholder="請直接貼上整段報表文字（例如：
CNH151011  7209355鄭永昌      76男...
CNH151012  5977541呂良鴻      80男...）"></textarea>
        <button class="btn-secondary" onclick="parseTextData()">解析並載入文字名單</button>

        <div class="status" id="fileStatus">狀態：尚未載入名單</div>
    </div>

    <!-- 2. 文字輸入與查詢區塊 -->
    <div class="section">
        <h3>2. 輸入文字進行比對</h3>
        <textarea id="inputText" placeholder="請在此貼上或輸入包含人名的文字..."></textarea>
        <br>
        <button onclick="searchNames()">開始比對並搜尋</button>
    </div>

    <!-- 3. 結果顯示區塊 -->
    <div class="section">
        <h3>3. 比對結果</h3>
        <table id="resultTable">
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>病歷號</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <tr>
                    <td colspan="2" style="text-align:center; color:#888;">尚無比對資料</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let patientData = []; // 儲存名單 [{name: '...', chartNo: '...'}, ...]

        // 可辨識的欄位名稱
        const NAME_HEADERS = ['院民姓名', '姓名', '病人姓名', 'Name'];
        const CHART_HEADERS = ['病歷號', '病歷號碼', 'ChartNo'];

        const DEFAULT_HEADER_ROW = 1;

        function setStatus(text, color) {
            const el = document.getElementById('fileStatus');
            el.innerText = text;
            el.style.color = color;
        }

        // 頁面載入時自動嘗試讀取同資料夾下的 "護家名單.xlsx"
        window.onload = function() {
            fetch('護家名單.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error("無法自動載入");
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    parseExcelData(buffer);
                    setStatus(`狀態：已自動載入 Excel，共 ${patientData.length} 筆資料`, "green");
                })
                .catch(err => {
                    setStatus("狀態：請選擇 Excel 檔或於文字框貼上名單", "orange");
                });
        };

        // 手動選擇 Excel 檔案處理
        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    parseExcelData(ev.target.result);
                    document.getElementById('manualDataInput').value = '';
                    setStatus(`狀態：已載入「${file.name}」，共 ${patientData.length} 筆資料`, "green");
                } catch (err) {
                    patientData = [];
                    setStatus("狀態：" + err.message, "red");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 解析文字框直接貼上的報表文字（針對「病歷號+姓名」黏在一起的格式）
        function parseTextData() {
            const rawText = document.getElementById('manualDataInput').value;
            if (!rawText.trim()) {
                alert("請先輸入或貼上包含病歷號與姓名的內容！");
                return;
            }

            const lines = rawText.split('\n');
            const newPatientData = [];

            // 正規表達式：尋找「連續數字」後面緊接著「中文字」（例如 7209355鄭永昌）
            // (\d+) 捕捉數字（病歷號），([\u4e00-\u9fa5]{2,4}) 捕捉 2 到 4 個字的中文姓名
            const regex = /(\d{4,})([\u4e00-\u9fa5]{2,4})/g;

            lines.forEach(line => {
                let match;
                // 用迴圈找出一行裡面可能出現的符合項目
                while ((match = regex.exec(line)) !== null) {
                    const chartNo = match[1];
                    const name = match[2];
                    
                    // 避免重複加入相同的病歷號與姓名
                    if (!newPatientData.some(item => item.name === name && item.chartNo === chartNo)) {
                        newPatientData.push({ name: name, chartNo: chartNo });
                    }
                }
            });

            if (newPatientData.length === 0) {
                alert("無法從文字中萃取合適的病歷號與姓名，請確認格式是否包含「數字+中文姓名」！");
                return;
            }

            patientData = newPatientData;
            document.getElementById('excelFileInput').value = ''; // 清空檔案選擇
            setStatus(`狀態：已從文字成功解析，共 ${patientData.length} 筆病患資料`, "green");
        }

        // 在某一列中尋找欄位索引
        function findCol(row, candidates) {
            for (const cand of candidates) {
                const idx = row.findIndex(c => String(c).trim() === cand);
                if (idx !== -1) return idx;
            }
            return -1;
        }

        // 解析 Excel 資料
        function parseExcelData(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });

            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', raw: false });

            let headerRow = -1, nameCol = -1, chartCol = -1;
            const scanOrder = [DEFAULT_HEADER_ROW];
            for (let i = 0; i < Math.min(rows.length, 10); i++) {
                if (i !== DEFAULT_HEADER_ROW) scanOrder.push(i);
            }
            for (const i of scanOrder) {
                if (!rows[i]) continue;
                const n = findCol(rows[i], NAME_HEADERS);
                if (n !== -1) {
                    headerRow = i;
                    nameCol = n;
                    chartCol = findCol(rows[i], CHART_HEADERS);
                    break;
                }
            }

            if (headerRow === -1) {
                throw new Error("找不到「院民姓名」欄位，請確認標題列位置");
            }
            if (chartCol === -1) {
                throw new Error("找不到「病歷號」欄位，請確認標題列位置");
            }

            patientData = [];
            for (let i = headerRow + 1; i < rows.length; i++) {
                const name = String(rows[i][nameCol] ?? '').trim();
                const chartNo = String(rows[i][chartCol] ?? '').trim();
                if (name) {
                    patientData.push({ name: name, chartNo: chartNo || '無資料' });
                }
            }
        }

        // 比對邏輯
        function searchNames() {
            const text = document.getElementById('inputText').value;
            const resultBody = document.getElementById('resultBody');
            resultBody.innerHTML = ''; 

            if (patientData.length === 0) {
                alert("請先載入 Excel 檔案或貼上文字名單！");
                return;
            }

            if (!text.trim()) {
                alert("請輸入要比對的文字！");
                return;
            }

            const seen = new Set();
            const matches = [];

            patientData.pop; // 避免語法干擾
            patientData.forEach(item => {
                const key = item.name + '|' + item.chartNo;
                const firstIndex = text.indexOf(item.name);

                if (firstIndex !== -1 && !seen.has(key)) {
                    seen.add(key);
                    matches.push({
                        ...item,
                        index: firstIndex
                    });
                }
            });

            matches.sort((a, b) => a.index - b.index);

            if (matches.length > 0) {
                matches.forEach(row => {
                    const tr = document.createElement('tr');
                    const td1 = document.createElement('td');
                    const td2 = document.createElement('td');
                    td1.textContent = row.name;
                    td2.textContent = row.chartNo;
                    tr.appendChild(td1);
                    tr.appendChild(td2);
                    resultBody.appendChild(tr);
                });
            } else {
                resultBody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:red;">文字中未發現符合名單的姓名</td></tr>';
            }
        }
    </script>

</body>
</html>
